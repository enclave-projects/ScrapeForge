[project]
name = "scrapeforge"
version = "0.1.0"
description = "Python client for the ScrapeForge API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapeforge"]
